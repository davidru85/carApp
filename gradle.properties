# Build and tooling configuration for the carApp MVP.
# Kotlin DSL only; no Groovy build scripts anywhere.

# Kotlin code style follows ktlint_official (configured in E0-05).
kotlin.code.style = ktlint_official

# Android
android.useAndroidX = true
android.nonTransitiveRClass = true

# KMP / Kotlin
kotlin.native.ignoreDisabledTargets = true

# Gradle performance
org.gradle.caching = true
org.gradle.parallel = true
org.gradle.jvmargs = -Xmx4g -XX:MaxMetaspaceSize=1g
org.gradle.configuration-cache = false
org.gradle.unsafe.configuration-cache = false

# The JDK toolchain is pinned in gradle/libs.versions.toml (E0-06) and applied through
# kotlin { jvmToolchain(...) } in each module, so it is not repeated here.

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
