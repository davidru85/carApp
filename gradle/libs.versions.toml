# Single source of dependency versions (E0-06).
#
# Every version used anywhere in the build is declared here and nowhere else, per the E0-06
# acceptance criterion "version choices are reflected in gradle/libs.versions.toml and nowhere
# else". docs/versions-matrix.md explains why each pin exists, which pins move together and
# which ADR backs it; changing any pin is a human review gate (AGENTS.md).

[versions]
# --- JDK toolchain (docs/versions-matrix.md, Android build group) ---
jdk = "21" # Gradle JVM and Kotlin JVM toolchain; LTS

# --- Android build group (Gradle, AGP, Compose BOM, SDK levels) ---
gradle = "9.7.1" # wrapper version; MUST match gradle/wrapper/gradle-wrapper.properties
agp = "9.3.1" # AGP 9.x is required by Compose BOM 2026.08.00 and pairs with Gradle 9.x
composeBom = "2026.08.00"
minSdk = "26" # fixed by docs/SPECIFICATION.md §11; do not change without a story
targetSdk = "36" # runtime opt-in, decided separately from compileSdk (E0-06)
compileSdk = "37"

# --- Kotlin toolchain group (Kotlin, KSP, SKIE, kotlinx-*) ---
# These move together: KSP and SKIE are published against Kotlin versions and the kotlinx
# libraries follow the Kotlin release train.
kotlin = "2.4.10"
ksp = "2.3.11" # KSP versions its own line since 2.3.0; 2.3.10+ supports Kotlin 2.4.x
skie = "0.10.14" # supports Kotlin 2.4.10; applied only to :shared (D-2)
coroutines = "1.11.0"
serialization = "1.11.0"
datetime = "0.8.0" # Instant is kotlin.time.Instant; see docs/versions-matrix.md

# --- SQLDelight database group (D-36) ---
sqldelight = "2.3.2"
sqldelightAndroidxDriver = "0.2.1"
sqlite = "2.7.0" # androidx.sqlite:sqlite-bundled, same bundled SQLite on both platforms

# --- Firebase group (D-0, D-5, D-6, D-10, D-21) ---
firebaseBom = "34.18.0"
gitlive = "2.6.0" # GitLive 2.6.x, never the 3.0 alpha (D-5, D-6)

# --- Application libraries ---
koin = "4.2.2" # D-3
kermit = "2.1.0" # D-15

# --- Verification and quality tooling ---
turbine = "1.2.1" # D-17
kover = "0.9.9" # D-18
konsist = "0.17.3" # D-16
detekt = "1.23.8" # E0-05
ktlint = "14.2.0" # org.jlleitschuh.gradle.ktlint plugin; E0-05
ktlintCli = "1.8.0" # ktlint engine used by the plugin; E0-05

# --- Apple toolchain (recorded here, consumed by CI and the Xcode project) ---
xcode = "26.6"

[libraries]
# Kotlin / KMP
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }

# SQLDelight with AndroidX bundled SQLite (D-36), introduced by E1-01
sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-async-extensions = { module = "app.cash.sqldelight:async-extensions", version.ref = "sqldelight" }
sqldelight-coroutines-extensions = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }
sqldelight-androidx-driver = { module = "com.eygraber:sqldelight-androidx-driver", version.ref = "sqldelightAndroidxDriver" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }

# Firebase (D-0, D-5, D-6, D-10, D-21), introduced by E0-07 / E2-02
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
gitlive-firebase-firestore = { module = "dev.gitlive:firebase-firestore", version.ref = "gitlive" }
gitlive-firebase-auth = { module = "dev.gitlive:firebase-auth", version.ref = "gitlive" }

# DI (D-3) and logging (D-15)
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }

# Gradle plugin artifacts, used only by the build-logic convention plugins (E0-02)
plugin-android-gradle = { module = "com.android.tools.build:gradle", version.ref = "agp" }
plugin-kotlin-gradle = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
plugin-skie-gradle = { module = "co.touchlab.skie:gradle-plugin", version.ref = "skie" }
plugin-ksp-gradle = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
plugin-sqldelight-gradle = { module = "app.cash.sqldelight:gradle-plugin", version.ref = "sqldelight" }
plugin-ktlint-gradle = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlint" }
plugin-detekt-gradle = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }
plugin-kover-gradle = { module = "org.jetbrains.kotlinx:kover-gradle-plugin", version.ref = "kover" }

# Verification tooling
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
konsist = { module = "com.lemonappdev:konsist", version.ref = "konsist" }

# Compose (Android only)
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-activity = { module = "androidx.activity:activity-compose", version = "1.9.3" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version = "1.15.0" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version = "2.8.7" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
skie = { id = "co.touchlab.skie", version.ref = "skie" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
