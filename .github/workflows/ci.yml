# CI for carApp.
#
# The job names below are the check names fixed by docs/CONTRACTS.md §18 and MUST NOT be renamed:
# branch protection for main requires them by name.
#
# CI duration under 20 minutes is a monitored objective, not a pass/fail criterion (E0-05).

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ktlint:
    name: ktlint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - run: ./gradlew ktlintCheck --stacktrace
      - name: No baseline suppression files
        run: |
          # E0-05: baseline files are forbidden. They hide existing violations instead of fixing
          # them, and this repository has no legacy code to grandfather.
          if find . -name 'detekt-baseline.xml' -o -name 'baseline.xml' -o -name '*.editorconfig.baseline' | grep -q .; then
            echo "::error::A lint baseline file is committed. docs/BACKLOG.md E0-05 forbids them."
            exit 1
          fi

  detekt:
    name: detekt
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - run: ./gradlew detekt --stacktrace

  architecture-check:
    name: architecture-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      # The fixtures run with the check: a rule that never fires would otherwise pass CI happily.
      - run: ./gradlew architectureCheck :build-logic:convention:test --stacktrace

  contract-check:
    name: contract-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloud-runtime-verification
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: 'package.json'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - run: ./gradlew contractCheck --stacktrace
      - name: Uninstrumented consumption performance gate
        run: ./gradlew :feature:fuel:consumptionBenchmark --stacktrace
      - name: Install Firestore rules test dependencies
        run: npm ci
      - name: Firestore security rules emulator tests
        run: npm run test:firestore-rules
      - name: Install Cloud Functions dependencies
        working-directory: functions
        run: npm ci
      - name: Cloud Functions production dependency audit
        working-directory: functions
        run: npm run audit
      - name: Cloud Functions tests
        working-directory: functions
        run: npm test
      - name: Cloud Functions Firestore emulator integration tests
        working-directory: functions
        run: npm run test:emulator
      - name: Authenticate for deployed runtime verification
        if: >-
          github.event_name == 'push' ||
          (github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor_id == '472324')
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          create_credentials_file: true
          service_account: github-runtime-verifier@davidruiz-carapp-dev.iam.gserviceaccount.com
          workload_identity_provider: projects/330616809208/locations/global/workloadIdentityPools/github-runtime-verification/providers/github
      - name: Install Google Cloud SDK for deployed runtime verification
        if: >-
          github.event_name == 'push' ||
          (github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor_id == '472324')
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - name: Verify the deployed Cloud Functions runtime
        if: >-
          github.event_name == 'push' ||
          (github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor_id == '472324')
        run: ./scripts/verify-cloud-runtime.sh

  android-assemble:
    name: android-assemble
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - run: ./gradlew :androidApp:assembleDebug --stacktrace

  android-instrumented-tests:
    name: android-instrumented-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Run Vehicle creation on an API 36 emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          arch: x86_64
          target: default
          disable-animations: true
          script: ./gradlew :androidApp:connectedDebugAndroidTest --stacktrace

  # shared-tests and ios-simulator-build are deliberately separate (D-35, ADR-0036). They answer
  # different questions — "does the shared logic behave the same on the JVM and on Kotlin/Native?"
  # versus "does the framework link and does the iOS app build against it?" — and a single job
  # cannot report both independently. They also run in parallel, so separating them costs no
  # wall-clock. Merging them requires superseding D-35.
  shared-tests:
    name: shared-tests
    # macOS is required here only by iosSimulatorArm64Test. Moving that test out also requires
    # superseding D-35.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Run Android application and KMP host tests
        timeout-minutes: 8
        run: ./gradlew :androidApp:testDebugUnitTest testAndroidHostTest --stacktrace
      # D-75 derives the current four exclusions from the transitive Native-test project graph
      # rooted at the two Firebase integrations. Keeping this invocation separate makes a Native
      # simulator stall visible instead of hiding it behind the Android-host aggregate.
      - name: Run Kotlin/Native simulator tests
        timeout-minutes: 8
        run: >-
          ./gradlew iosSimulatorArm64Test
          -x :integration:firebase-auth:iosSimulatorArm64Test
          -x :integration:firebase-firestore:iosSimulatorArm64Test
          -x :wiring:firebase:iosSimulatorArm64Test
          -x :composition:ios:iosSimulatorArm64Test
          --stacktrace
      - name: Coverage thresholds
        timeout-minutes: 4
        run: ./gradlew koverVerify --stacktrace

  ios-simulator-build:
    name: ios-simulator-build
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Check the pinned Xcode major version
        run: |
          # docs/versions-matrix.md pins Xcode 26.6 and says it is pinned on the CI runner too.
          # A different major version is a real toolchain drift and fails; a different patch is
          # reported, because runner images move faster than a pin can be reviewed.
          PINNED=$(grep -E '^xcode = ' gradle/libs.versions.toml | sed -E 's/.*"([^"]+)".*/\1/')
          ACTUAL=$(xcodebuild -version | head -1 | awk '{print $2}')
          echo "pinned=$PINNED actual=$ACTUAL"
          if [ "${PINNED%%.*}" != "${ACTUAL%%.*}" ]; then
            echo "::error::Xcode major version drift: pinned $PINNED, runner has $ACTUAL. Update docs/versions-matrix.md and gradle/libs.versions.toml in a reviewed change."
            exit 1
          fi
          if [ "$PINNED" != "$ACTUAL" ]; then
            echo "::warning::Xcode patch drift: pinned $PINNED, runner has $ACTUAL."
          fi
      - name: Link the optimized consumption device-test binary
        run: ./gradlew :feature:fuel:linkReleaseTestIosArm64 --stacktrace
      - run: ./gradlew :composition:ios:linkDebugFrameworkIosSimulatorArm64 --stacktrace
      - name: Run iOS tests
        working-directory: iosApp
        run: |
          DEVICE_ID=$(xcrun simctl list devices available iPhone | grep -E -o '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}' | head -n 1)
          xcodebuild -project carApp.xcodeproj -scheme carApp -sdk iphonesimulator \
            -destination "id=$DEVICE_ID" ARCHS=arm64 ONLY_ACTIVE_ARCH=NO test

  objc-header-golden-check:
    name: objc-header-golden-check
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Generate the Objective-C header
        run: ./gradlew :composition:ios:linkDebugFrameworkIosSimulatorArm64 --stacktrace
      - name: Compare the generated Objective-C header with the golden file
        run: |
          SOURCE=composition/ios/build/bin/iosSimulatorArm64/debugFramework/Shared.framework/Headers/Shared.h
          GOLDEN=shared/build/generated/objc-header/Shared.h.golden
          test -f "$SOURCE"
          test -f "$GOLDEN"
          diff -u "$GOLDEN" "$SOURCE"

  provider-decoupling:
    name: provider-decoupling
    # D-45: dependency leaks can be target-specific, so the provider-free graph is tested on both
    # Android host (JVM) and iosSimulatorArm64 (Kotlin/Native) under one protected check name.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Run provider-free Android host tests
        timeout-minutes: 8
        run: >-
          ./gradlew -Pcarapp.excludeFirebaseProviders=true
          :shared:testAndroidHostTest
          --stacktrace
      - name: Run provider-free Kotlin/Native simulator tests
        timeout-minutes: 8
        run: >-
          ./gradlew -Pcarapp.excludeFirebaseProviders=true
          :shared:iosSimulatorArm64Test
          --max-workers=2
          --stacktrace
