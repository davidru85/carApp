name: carApp
options:
  bundleIdPrefix: com.ruizurraca.carapp
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
configs:
  Debug: debug
  Release: release
  # `D-259`: release settings with the development project, for local verification and `E4-03`.
  Staging: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    # `D-250`: the first release. `MARKETING_VERSION` is MAJOR.MINOR.PATCH and
    # `CURRENT_PROJECT_VERSION` rises by one per upload to either store.
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    exactVersion: ${FIREBASE_APPLE_VERSION}
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    exactVersion: ${GOOGLE_SIGN_IN_IOS_VERSION}
targets:
  carApp:
    type: application
    platform: iOS
    sources:
      - path: ContentView.swift
      - path: WalkingSkeletonModel.swift
      - path: Onboarding.swift
      - path: NativeSignIn.swift
      - path: WelcomeView.swift
      - path: AppCheckProviderFactory.swift
      - path: carAppApp.swift
      - path: ScaledFormatting.swift
      - path: SceneBackgroundTracking.swift
      - path: FuelEntryCalendarDay.swift
      - path: UiMessageMapping.swift
      - path: ViewModels.swift
      - path: VehicleListView.swift
      - path: VehicleDetailView.swift
      - path: VehicleFormView.swift
      - path: FuelEntryFormView.swift
      - path: DiagnosticsView.swift
      - path: AnonymousReminderView.swift
      - path: SyncStatusVisual.swift
      - path: SyncStatusIndicatorView.swift
      - path: AccessibilitySupport.swift
      - path: AccountConversionSurface.swift
      - path: AppVersion.swift
      - path: SettingsPresentation.swift
      - path: DeparturePresentation.swift
      - path: SettingsViewModel.swift
      - path: SettingsView.swift
      - path: DepartureView.swift
      - path: DeparturePromptPresenter.swift
      # E4-02: the two catalogues are walked from this directory so that XcodeGen builds one
      # `Localizable.strings` variant group and lists `es` in knownRegions. A direct `.lproj` path
      # is a folder reference and never registers its region.
      - path: .
        includes:
          - "en.lproj"
          - "en.lproj/**"
          - "es.lproj"
          - "es.lproj/**"
        buildPhase: resources
      # `D-238`/`D-259`: each configuration bundles only its own Firebase plist. The development one
      # serves Debug and Staging; Release bundles the production plist that `E4-10` adds, and until it
      # exists the build fails before packaging instead of falling back.
      - path: Assets.xcassets
      - path: Config/Debug/GoogleService-Info-Debug.plist
        buildPhase: resources
      - path: Config/Staging/GoogleService-Info.plist
        buildPhase: resources
    dependencies:
      - package: Firebase
        product: FirebaseAppCheck
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      # E3-09: the GitLive firebase-analytics cinterop binds FIRAnalytics, so the static Shared
      # framework's FirebaseAnalytics references must be linked by the app target (D-65, ADR-0076).
      # D-203 selects the pinned no-ad-ID product; FIRAnalytics remains the same framework.
      - package: Firebase
        product: FirebaseAnalyticsWithoutAdIdSupport
      # E4-04: the GitLive firebase-crashlytics cinterop binds FIRCrashlytics, so the static Shared
      # framework's FirebaseCrashlytics references must be linked by the app target (D-65, ADR-0076).
      - package: Firebase
        product: FirebaseCrashlytics
      - package: GoogleSignIn
        product: GoogleSignIn
    preBuildScripts:
      - name: Build Shared framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :composition:ios:embedAndSignAppleFrameworkForXcode
      # `D-238`: a configuration must carry exactly the Firebase pair its name implies, and a Release
      # build must not fall back to development values. ADR-0055 requires the failure before packaging,
      # which `FirebaseApp.configure()` at launch cannot do.
      # `D-240`: Crashlytics can read an iOS report only if its dSYMs were uploaded from the build that
      # produced it. The phase runs for archives and Release builds of the app target only; Staging and
      # Debug are development configurations and must not upload to any project.
      - name: Upload Crashlytics symbols
        basedOnDependencyAnalysis: false
        script: |
          if [ "${CONFIGURATION}" != "Release" ]; then
            echo "Skipping Crashlytics symbol upload for ${CONFIGURATION}."
            exit 0
          fi
          dsym="${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}"
          if [ ! -d "$dsym" ]; then
            echo "warning: no dSYM at $dsym; Crashlytics reports for this build will be unreadable" >&2
            exit 0
          fi
          "${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
        inputFiles:
          - $(SRCROOT)/$(BUILT_PRODUCTS_DIR)/$(INFOPLIST_PATH)
      - name: Verify Firebase configuration for this configuration
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          case "$CONFIGURATION" in
            Debug|Staging)
              expected_plist="GoogleService-Info-Debug.plist"
              ;;
            Release)
              expected_plist="GoogleService-Info.plist"
              ;;
            *)
              echo "error: unknown configuration $CONFIGURATION" >&2
              exit 1
              ;;
          esac
          if [ -z "${GOOGLE_REVERSED_CLIENT_ID:-}" ]; then
            echo "error: GOOGLE_REVERSED_CLIENT_ID is empty for $CONFIGURATION; its Firebase.xcconfig must supply the reversed client ID of $expected_plist" >&2
            exit 1
          fi
          plist="$SRCROOT/Config/$CONFIGURATION/$( [ "$CONFIGURATION" = "Debug" ] && echo GoogleService-Info-Debug.plist || ( [ "$CONFIGURATION" = "Staging" ] && echo GoogleService-Info.plist || echo GoogleService-Info.plist ) )"
          if [ ! -f "$plist" ]; then
            echo "error: $CONFIGURATION needs $plist, which does not exist yet (E4-10 supplies the Release one)" >&2
            exit 1
          fi
          configured="$(/usr/libexec/PlistBuddy -c 'Print :REVERSED_CLIENT_ID' "$plist")"
          if [ "$configured" != "$GOOGLE_REVERSED_CLIENT_ID" ]; then
            echo "error: $CONFIGURATION Google URL scheme $GOOGLE_REVERSED_CLIENT_ID does not match $plist ($configured)" >&2
            exit 1
          fi
    configFiles:
      Debug: Config/Debug/Firebase.xcconfig
      Release: Config/Release/Firebase.xcconfig
      Staging: Config/Staging/Firebase.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ruizurraca.carapp
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: carApp.entitlements
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.ruizurraca.carapp.debug
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.ruizurraca.carapp
          EXCLUDED_SOURCE_FILE_NAMES: GoogleService-Info-Debug.plist
        Staging:
          PRODUCT_BUNDLE_IDENTIFIER: com.ruizurraca.carapp.debug
          EXCLUDED_SOURCE_FILE_NAMES: GoogleService-Info.plist
          KOTLIN_FRAMEWORK_BUILD_TYPE: release
  carAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Tests
    dependencies:
      - target: carApp
      - package: GoogleSignIn
        product: GoogleSignIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ruizurraca.carapp.tests
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        TEST_TARGET_NAME: carApp
        SUPPORTED_PLATFORMS: iphonesimulator
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(BUILT_PRODUCTS_DIR)
  carAppUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: UITests
    dependencies:
      - target: carApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ruizurraca.carapp.uitests
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        TEST_TARGET_NAME: carApp
        SUPPORTED_PLATFORMS: iphonesimulator
      configs:
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: CarAppKeychainPersistenceUITests.swift
schemes:
  carApp:
    build:
      targets:
        carApp: all
        carAppTests: [test]
        carAppUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - carAppTests
        - carAppUITests
      environmentVariables:
        CARAPP_IOS_APP_CHECK_DEBUG_TOKEN: $(CARAPP_XCUITEST_APP_CHECK_DEBUG_TOKEN)
    archive:
      config: Release
