name: carApp
options:
  bundleIdPrefix: com.ruizurraca.carapp
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    exactVersion: ${FIREBASE_APPLE_VERSION}
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    exactVersion: ${GOOGLE_SIGN_IN_IOS_VERSION}
targets:
  carApp:
    type: application
    platform: iOS
    sources:
      - path: ContentView.swift
      - path: WalkingSkeletonModel.swift
      - path: Onboarding.swift
      - path: NativeSignIn.swift
      - path: WelcomeView.swift
      - path: AppCheckProviderFactory.swift
      - path: carAppApp.swift
      - path: ScaledFormatting.swift
      - path: FuelEntryCalendarDay.swift
      - path: UiMessageMapping.swift
      - path: ViewModels.swift
      - path: VehicleListView.swift
      - path: VehicleDetailView.swift
      - path: VehicleFormView.swift
      - path: FuelEntryFormView.swift
      - path: DiagnosticsView.swift
      - path: en.lproj
        buildPhase: resources
      - path: es.lproj
        buildPhase: resources
      - path: Config/Debug/GoogleService-Info-Debug.plist
    dependencies:
      - package: Firebase
        product: FirebaseAppCheck
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseFirestore
      - package: GoogleSignIn
        product: GoogleSignIn
    preBuildScripts:
      - name: Build Shared framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :composition:ios:embedAndSignAppleFrameworkForXcode
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ruizurraca.carapp
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: carApp.entitlements
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.ruizurraca.carapp.debug
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.ruizurraca.carapp
          EXCLUDED_SOURCE_FILE_NAMES: GoogleService-Info-Debug.plist
  carAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Tests
    dependencies:
      - target: carApp
      - package: GoogleSignIn
        product: GoogleSignIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ruizurraca.carapp.tests
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        TEST_TARGET_NAME: carApp
        SUPPORTED_PLATFORMS: iphonesimulator
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(BUILT_PRODUCTS_DIR)
  carAppUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: UITests
    dependencies:
      - target: carApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ruizurraca.carapp.uitests
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        TEST_TARGET_NAME: carApp
        SUPPORTED_PLATFORMS: iphonesimulator
      configs:
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: CarAppKeychainPersistenceUITests.swift
schemes:
  carApp:
    build:
      targets:
        carApp: all
        carAppTests: [test]
        carAppUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - carAppTests
        - carAppUITests
      environmentVariables:
        CARAPP_IOS_APP_CHECK_DEBUG_TOKEN: $(CARAPP_XCUITEST_APP_CHECK_DEBUG_TOKEN)
    archive:
      config: Release
