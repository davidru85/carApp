name: carApp
options:
  bundleIdPrefix: com.ruizurraca.carapp
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    exactVersion: ${FIREBASE_APPLE_VERSION}
targets:
  carApp:
    type: application
    platform: iOS
    sources:
      - path: ContentView.swift
      - path: WalkingSkeletonModel.swift
      - path: AppCheckProviderFactory.swift
      - path: carAppApp.swift
      - path: en.lproj
      - path: es.lproj
      - path: Config/Debug/GoogleService-Info-Debug.plist
    dependencies:
      - package: Firebase
        product: FirebaseAppCheck
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseFirestore
    preBuildScripts:
      - name: Build Shared framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :composition:ios:embedAndSignAppleFrameworkForXcode
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ruizurraca.carapp
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: carApp.entitlements
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.ruizurraca.carapp.debug
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.ruizurraca.carapp
